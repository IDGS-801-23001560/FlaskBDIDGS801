{% extends "layout.html" %}

{% block container %}

<div class="flex flex-col items-center w-full py-10 px-4">
    
    <h1 class="text-3xl font-bold mb-8 text-heading text-center">Detalles del Alumno</h1>

    <div class="flex flex-col items-center bg-neutral-primary-soft p-6 border border-default rounded-base shadow-xs md:flex-row md:max-w-xl w-full">
        
        <img class="object-cover w-full rounded-base h-64 md:h-auto md:w-48 mb-4 md:mb-0" 
             src="https://ui-avatars.com/api/?name={{ alumno.nombre }}+{{ alumno.apaterno }}&background=0D8ABC&color=fff&size=200" 
             alt="Avatar de {{ alumno.nombre }}">
        
        <div class="flex flex-col justify-between md:p-4 leading-normal w-full">
            
            <h5 class="mb-2 text-2xl font-bold tracking-tight text-heading">
                {{ alumno.nombre }} {{ alumno.apaterno }} {{ alumno.amaterno }}
            </h5>
            
            <div class="mb-6 text-body">
                <p class="mb-2">
                    <span class="font-bold text-gray-700">Correo Electrónico:</span> {{ alumno.email }}
                </p>
                <p class="mb-2">
                    <span class="font-bold text-gray-700">Fecha de Registro:</span> {{ alumno.created_date }}
                </p>
            </div>

            <div>
                <a href="{{ url_for('index') }}" class="inline-flex items-center w-auto text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none transition-colors">
                    <svg class="w-4 h-4 mr-2 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 12H5m14 0-4 4m4-4-4-4"/>
                    </svg>
                    Regresar a la Lista
                </a>
            </div>
        </div>
    </div>

</div>

{% endblock %}
