{% extends "layout.html" %}

{% block container %}
<div class="flex flex-col items-center justify-center w-full py-20 px-4">
    
    <div class="max-w-3xl text-center bg-white p-10 rounded-2xl shadow-md border border-gray-200 mt-10">
        
        <h1 class="mb-6 text-4xl md:text-5xl font-bold text-gray-900">
            Bienvenido al Sistema de Gestión Escolar
        </h1>
        
        <p class="mb-8 text-lg text-gray-600 sm:px-16 xl:px-48">
            Administra fácilmente los registros de alumnos, maestros, cursos e inscripciones desde un solo lugar seguro y eficiente.
        </p>
        
        <div class="flex flex-col mb-8 lg:mb-16 space-y-4 sm:flex-row sm:justify-center sm:space-y-0 sm:space-x-4">
            <a href="{{ url_for('alumnos.listado') }}" class="inline-flex justify-center items-center py-3 px-5 text-base font-medium text-center text-white rounded-lg bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 transition-colors">
                Módulo Alumnos
                <svg class="ml-2 -mr-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
            </a>
            <a href="{{ url_for('maestros.listado') }}" class="inline-flex justify-center items-center py-3 px-5 text-base font-medium text-center text-gray-900 rounded-lg border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 transition-colors">
                Módulo Maestros
            </a>
        </div>
        
    </div>

</div>
{% endblock %}
