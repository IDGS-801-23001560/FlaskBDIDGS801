{% extends "layout.html" %}

{% block container %}

<div class="flex flex-col items-center justify-center w-full min-h-[60vh] py-10 px-4 pb-28">
    
    <div class="w-full max-w-md p-6 bg-white border border-gray-200 rounded-lg shadow-md text-center">
        
        <svg class="mx-auto mb-4 text-gray-400" style="width: 64px; height: 64px;" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        
        <h3 class="mb-5 text-lg font-normal text-gray-600">
            ¿Estás seguro de que deseas eliminar permanentemente al alumno <br>
            <strong class="text-gray-900 text-xl">{{ alumno.nombre }} {{ alumno.apaterno }}</strong>?
        </h3>
        
        <form method="POST" action="" class="flex flex-col sm:flex-row justify-center gap-3">
            {{ form.hidden_tag() }}
            
            <button type="submit" class="text-white bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm inline-flex items-center justify-center px-5 py-2.5 transition-colors">
                Sí, eliminar
            </button>
            
            <a href="{{ url_for('alumnos.listado') }}" class="text-gray-500 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 rounded-lg border border-gray-200 text-sm font-medium px-5 py-2.5 hover:text-gray-900 transition-colors">
                No, cancelar
            </a>
        </form>

    </div>

</div>

{% endblock %}
